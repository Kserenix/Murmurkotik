
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Котики хорошие</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background: linear-gradient(135deg, #0f172a, #312e81);
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .gif {
            width: 280px;
            max-width: 100%;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        p {
            color: #dbeafe;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;

            color: white;
            text-decoration: none;
            background: #6366f1;

            border-radius: 12px;
            transition: 0.3s;
        }

        .button:hover {
            background: #818cf8;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <div class="card">
        <img
            class="gif"
            src="гифка кота.gif"
            alt="Анимация"
        >

        <h1>Привет! 👋</h1>

        <p>
            Добро пожаловать на мою маленькую страницу.
            Здесь немного текста, красивая анимация
            и простой современный дизайн.
        </p>

        <a class="button" href="#">
            Узнать больше
        </a>

    </div>

</body>
</html>
